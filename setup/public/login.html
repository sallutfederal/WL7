<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - WL7 STORE</title>
<style>
  :root { --bg: #0a0a0f; --bg2: #14141a; --border: #2a2a35; --text: #e8e8e8; --muted: #8a8a95; --accent: #d4af37; --accent2: #ffd700; --red: #ef4444; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .login-box { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .logo { text-align: center; margin-bottom: 30px; }
  .logo h1 { color: var(--accent2); font-size: 28px; font-weight: 800; letter-spacing: 2px; }
  .logo p { color: var(--muted); font-size: 12px; margin-top: 4px; text-transform: uppercase; letter-spacing: 1px; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 6px; text-transform: uppercase; letter-spacing: .5px; }
  .input { width: 100%; background: var(--bg3, #1e1e26); border: 1px solid var(--border); color: var(--text); padding: 12px 16px; border-radius: 8px; font-size: 14px; }
  .input:focus { outline: none; border-color: var(--accent2); }
  .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #000; margin-top: 8px; }
  .btn:hover { filter: brightness(1.1); }
  .error { color: var(--red); font-size: 13px; margin-top: 12px; text-align: center; display: none; }
  .brand-crest {
    width: 64px;
    height: 64px;
    margin: 0 auto 14px;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 30% 25%, rgba(255, 215, 0, 0.25), rgba(212, 175, 55, 0.06) 70%);
    border: 1px solid rgba(255, 215, 0, 0.45);
    box-shadow: 0 0 28px rgba(212, 175, 55, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.2);
  }
</style>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
  <div class="login-box">
    <div class="logo">
      <div class="brand-crest">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 3L8.5 8.5L12 6.5L15.5 8.5L20 3L19 11.5L21 15L16.5 18.5L12 21.5L7.5 18.5L3 15L5 11.5L4 3Z" fill="url(#wl7_gold)" fill-opacity="0.22" stroke="url(#wl7_gold)" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M8.5 13L10.5 14.5M15.5 13L13.5 14.5M12 16.5L10.5 18H13.5L12 16.5Z" stroke="#FFD700" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <defs>
            <linearGradient id="wl7_gold" x1="3" y1="3" x2="21" y2="21.5" gradientUnits="userSpaceOnUse">
              <stop stop-color="#FFE066"/>
              <stop offset="1" stop-color="#B8860B"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <h1>WL7 STORE</h1>
      <p><i class="ph-duotone ph-shield-check" style="vertical-align: middle; color: var(--accent2);"></i> Acesso Restrito</p>
    </div>
    <form id="loginForm">
      <div class="form-group">
        <label>Usuário</label>
        <input type="text" id="username" class="input" placeholder="Digite seu usuário" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label>Senha</label>
        <input type="password" id="password" class="input" placeholder="••••••••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn">Entrar</button>
      <div class="error" id="errorMsg">Credenciais inválidas</div>
    </form>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('errorMsg');
      errEl.style.display = 'none';
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      const r = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, password: p }),
      });
      if (r.ok) {
        window.location.href = '/';
      } else {
        const data = await r.json().catch(() => ({}));
        errEl.textContent = data.error || 'Credenciais inválidas';
        errEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
