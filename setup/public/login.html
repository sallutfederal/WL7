<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - WL7 STORE</title>
<style>
  :root { --bg: #09090b; --bg2: #101014; --bg3: #18181e; --border: #22222a; --text: #f4f4f5; --muted: #71717a; --accent: #7c3aed; --accent2: #a78bfa; --red: #ef4444; }
  body.light-mode { --bg: #fafafa; --bg2: #ffffff; --bg3: #f4f4f5; --border: #e4e4e7; --text: #09090b; --muted: #71717a; --accent: #6d28d9; --accent2: #7c3aed; --red: #dc2626; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; -webkit-font-smoothing: antialiased; }
  .login-box { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 36px; width: 100%; max-width: 380px; }
  .logo { text-align: center; margin-bottom: 28px; }
  .logo h1 { color: var(--text); font-size: 20px; font-weight: 600; letter-spacing: 0.5px; }
  .logo p { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 6px; font-weight: 500; }
  .input { width: 100%; background: var(--bg3); border: 1px solid var(--border); color: var(--text); padding: 10px 12px; border-radius: 8px; font-size: 13.5px; transition: border-color 0.15s ease; }
  .input:focus { outline: none; border-color: var(--accent); }
  .btn { width: 100%; padding: 10px 14px; border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; font-size: 13.5px; font-weight: 500; cursor: pointer; background: var(--accent); color: #fff; margin-top: 8px; transition: background 0.15s ease; }
  .btn:hover { background: #6d28d9; }
  .error { color: var(--red); font-size: 12.5px; margin-top: 12px; text-align: center; display: none; }
  .brand-crest {
    width: 44px;
    height: 44px;
    margin: 0 auto 12px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(124, 58, 237, 0.12);
    border: 1px solid rgba(124, 58, 237, 0.28);
    color: var(--accent2);
  }
</style>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
  <div class="login-box">
    <div class="logo">
      <div class="brand-crest">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 3L8.5 8.5L12 6.5L15.5 8.5L20 3L19 11.5L21 15L16.5 18.5L12 21.5L7.5 18.5L3 15L5 11.5L4 3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1>WL7 STORE</h1>
      <p><i class="ph-duotone ph-shield-check" style="vertical-align: middle; color: var(--accent2);"></i> Acesso Administrativo</p>
    </div>
    <form id="loginForm">
      <div class="form-group">
        <label>Usuário</label>
        <input type="text" id="username" class="input" placeholder="Digite seu usuário" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label>Senha</label>
        <input type="password" id="password" class="input" placeholder="••••••••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn">Entrar</button>
      <div class="error" id="errorMsg">Credenciais inválidas</div>
    </form>
  </div>
  <script>
    if (localStorage.getItem('theme') === 'light') document.body.classList.add('light-mode');
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('errorMsg');
      errEl.style.display = 'none';
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      const r = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, password: p }),
      });
      if (r.ok) {
        window.location.href = '/';
      } else {
        const data = await r.json().catch(() => ({}));
        errEl.textContent = data.error || 'Credenciais inválidas';
        errEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
