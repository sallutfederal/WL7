<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - WL7 STORE</title>
<style>
  :root { --bg: #0a0a0f; --bg2: #14141a; --border: #2a2a35; --text: #e8e8e8; --muted: #8a8a95; --accent: #d4af37; --accent2: #ffd700; --red: #ef4444; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .login-box { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .logo { text-align: center; margin-bottom: 30px; }
  .logo h1 { color: var(--accent2); font-size: 28px; font-weight: 800; letter-spacing: 2px; }
  .logo p { color: var(--muted); font-size: 12px; margin-top: 4px; text-transform: uppercase; letter-spacing: 1px; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 6px; text-transform: uppercase; letter-spacing: .5px; }
  .input { width: 100%; background: var(--bg3, #1e1e26); border: 1px solid var(--border); color: var(--text); padding: 12px 16px; border-radius: 8px; font-size: 14px; }
  .input:focus { outline: none; border-color: var(--accent2); }
  .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #000; margin-top: 8px; }
  .btn:hover { filter: brightness(1.1); }
  .error { color: var(--red); font-size: 13px; margin-top: 12px; text-align: center; display: none; }
  .wolf { font-size: 48px; display: block; margin-bottom: 8px; }
</style>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">\n</head>
<body>
  <div class="login-box">
    <div class="logo">
      <span class="wolf">&#128058;</span>
      <h1>WL7 STORE</h1>
      <p>Painel de Controle</p>
    </div>
    <form id="loginForm">
      <div class="form-group">
        <label>Usuario</label>
        <input type="text" id="username" class="input" placeholder="WL7 STORE" autocomplete="username">
      </div>
      <div class="form-group">
        <label>Senha</label>
        <input type="password" id="password" class="input" placeholder="********" autocomplete="current-password">
      </div>
      <button type="submit" class="btn">Entrar</button>
      <div class="error" id="errorMsg">Credenciais invalidas</div>
    </form>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: u, password: p }) });
      if (r.ok) { window.location.href = '/'; }
      else { document.getElementById('errorMsg').style.display = 'block'; }
    });
  </script>
</body>
</html>
